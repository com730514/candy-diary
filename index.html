function render(){ $("head").querySelector("svg")?.remove();if(!$("head").querySelector(".brand-art"))$("head").insertAdjacentHTML("afterbegin",pic("brand","brand-art")); $('nav').innerHTML=tabs.map(([k,n],i)=>`<button class="${i===tab?'active':''}" onclick="${i===1?'load(date)':`go(${i})`}">${pic(k)}${n}</button>`).join('');let p=$('page');if(tab===0)p.innerHTML=`<div class="card fortune"><div class="ribbon">${pic('bow')}</div><h2>今日糖果籤</h2><p class="question">今天會遇見什麼小美好？</p>${pic("hero","hero-art")}${card?`<div class="tag">${esc(card)}</div>`:""}<div class="actions"><button class="drawbutton" onclick="drawCard()">${pic('draw')} 抽一張糖果籤</button><button onclick="collectCard()" ${card?'':'disabled'}>${pic('star')} 收藏</button></div></div>`;if(tab===1){let x=data.diary[date]||{};p.innerHTML=`<h2>${icon('diary')} 今日的小美好</h2><div class="paper"><label>日期<input type="date" value="${date}" onchange="load(this.value)"></label><div class="icons" id="moods">${['開心','平靜','疲累','難過','生氣'].map((n,i)=>`<button class="${mood===i?'chosen':''}" onclick="mood=${i};document.querySelectorAll('#moods button').forEach((b,j)=>b.classList.toggle('chosen',j===${i}))">${icon('bear',i)}${n}</button>`).join('')}</div><input id="title" placeholder="給今天一個可愛的標題" value="${esc(x.title)}"><textarea id="body" placeholder="今天發生了什麼小美好？">${esc(x.body)}</textarea><div id="photos"></div><button onclick="$('file').click()">${icon('photo')} 加入照片（最多9張）</button><input hidden type="file" id="file" accept="image/*" multiple onchange="addPhotos(this.files)"><div class="icons" id="stick">${['bow','bear','berry','flower','star','pudding'].map(k=>`<button class="${stick.includes(k)?'chosen':''}" onclick="this.classList.toggle('chosen');stick.includes('${k}')?stick=stick.filter(x=>x!=='${k}'):stick.push('${k}')">${icon(k)}</button>`).join('')}</div><button class="primary" onclick="storeDiary()">${icon('heart')} 儲存今日回憶</button></div>`;showPhotos()}if(tab===2)p.innerHTML=`<h2>${icon('memo')} 糖果便利貼</h2><div class="row"><input id="note" placeholder="寫下待辦或靈感" onkeydown="if(event.key==='Enter')addNote()"><button onclick="addNote()">＋</button></div>${data.notes.map((n,i)=>`<div class="note">${icon('bow')}<input type="checkbox" ${n.done?'checked':''} onchange="data.notes[${i}].done=this.checked;save();render()"><span style="${n.done?'text-decoration:line-through':''}">${esc(n.text)}</span><button onclick="data.notes.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">把靈感放進第一張小便條吧。</p>'}`;if(tab===3){let y=month.getFullYear(),m=month.getMonth(),start=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();p.innerHTML=`<h2>${icon('calendar')} 回憶小月曆</h2><div class="row"><button onclick="shift(-1)">‹</button><b>${y} 年 ${m+1} 月</b><button onclick="shift(1)">›</button></div><div class="calendar">${'日一二三四五六'.split('').map(v=>`<p>${v}</p>`).join('')}${'<span></span>'.repeat(start)}${Array.from({length:count},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`,x=data.diary[d];return `<button class="${d===today()?'chosen':''}" onclick="load('${d}')">${i+1}${x?'<br>'+icon('bear',x.mood):''}</button>`}).join('')}</div><p class="muted">點選日期，翻開當天的回憶。</p>`}if(tab===4)p.innerHTML=`<h2>${icon('star')} 小小收藏館</h2>${data.stars.map((s,i)=>`<div class="note">${icon('star')}<span>${esc(s)}</span><button onclick="data.stars.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">收藏的糖果籤會出現在這裡。</p>'}<details><summary>手帳備份設定</summary><button class="primary" onclick="backup()">下載完整備份</button><button class="primary" onclick="$('restore').click()">還原備份</button><input hidden id="restore" type="file" accept=".json" onchange="restore(this.files[0])"><p class="muted">資料存於目前瀏覽器，請定期備份。</p></details>`}
function drawCard(){let choices=cards.filter(x=>x!==card);card=choices[Math.floor(Math.random()*choices.length)];render();let hero=document.querySelector(".hero-art");candyPop(hero);candyBurst(hero)}function collectCard(){if(!card)return;if(data.stars.includes(card)){alert('這張糖果籤已在收藏館');return}data.stars.push(card);if(save()){candyBurst(document.querySelector('.actions button:last-child'),'heart');candyToast('已收藏甜甜的小幸運！')}}
function shift(n){month=new Date(month.getFullYear(),month.getMonth()+n,1);render()}function addNote(){let t=$('note').value.trim();if(t){data.notes.push({text:t,done:false});save();render()}}function showPhotos(){$('photos').innerHTML=photos.map((s,i)=>`<div class="photo"><img src="${esc(s)}"><button onclick="photos.splice(${i},1);showPhotos()">×</button></div>`).join('')}async function addPhotos(files){for(let f of Array.from(files).slice(0,9-photos.length)){try{let b=await createImageBitmap(f),c=document.createElement('canvas'),r=Math.min(1,800/Math.max(b.width,b.height));c.width=b.width*r;c.height=b.height*r;c.getContext('2d').drawImage(b,0,0,c.width,c.height);photos.push(c.toDataURL('image/jpeg',.72));b.close()}catch{alert('無法讀取其中一張照片')}}showPhotos()}function storeDiary(){data.diary[date]={title:$('title').value,body:$('body').value,mood,stick,photos};if(save()){candyBurst(document.querySelector('.primary'),'heart');candyToast('甜甜的回憶已儲存！')}}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));a.download='candy-diary-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(f){try{let x=JSON.parse(await f.text());if(!x.diary||!Array.isArray(x.notes)||!Array.isArray(x.stars))throw 0;if(confirm('還原將覆蓋目前新版資料，確定？')){data=x;save();render()}}catch{alert('無法讀取此備份')}}render();
function candyBurst(el,kind='star'){if(!el||document.body.classList.contains('motion-off')||matchMedia('(prefers-reduced-motion: reduce)').matches)return;const r=el.getBoundingClientRect();for(let i=0;i<8;i++){const p=document.createElement('span'),a=i*Math.PI/4;p.className='candy-particle';p.innerHTML=icon(kind);p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';p.style.setProperty('--dx',Math.cos(a)*85+'px');p.style.setProperty('--dy',(Math.sin(a)*65-35)+'px');p.style.setProperty('--rot',(i*24-80)+'deg');document.body.append(p);setTimeout(()=>p.remove(),1050)}}
function candyPop(el){if(!el)return;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),700)}
function candyToast(msg){document.querySelector('.candy-toast')?.remove();let t=document.createElement('div');t.className='candy-toast';t.setAttribute('role','status');t.textContent=msg;document.body.append(t);setTimeout(()=>t.remove(),2200)}
document.addEventListener('click',e=>{let el=e.target.closest('.hero-art,.brand-art');if(el){candyPop(el);candyBurst(el,el.matches('.brand-art')?'heart':'star')}});
let motionButton=document.createElement('button');motionButton.className='motion-control';motionButton.textContent='暫停小動畫';motionButton.setAttribute('aria-pressed','false');motionButton.onclick=()=>{let off=document.body.classList.toggle('motion-off');motionButton.textContent=off?'開啟小動畫':'暫停小動畫';motionButton.setAttribute('aria-pressed',String(off))};document.querySelector('footer')?.append(motionButton);
</script></html>
